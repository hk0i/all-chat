# Optional override enabling file-based secrets (docs/EDD-V2.md §6) — an
# alternative to plain env vars in .env, not a replacement. Docker Compose
# requires a declared secret's source file to exist at `up` time, which
# would break the zero-config default for anyone not using this, so it's
# kept out of docker-compose.yml itself.
#
# Usage:
#   1. Put your secrets (KEY=VALUE per line, same shape as .env) in a file,
#      e.g. ~/.allchat/secrets, and chmod 600 it (same convention as ~/.ssh/).
#   2. Set ALLCHAT_SECRETS_FILE to that file's absolute path — in your
#      shell env or in .env (no `~` — Compose doesn't expand it).
#   3. docker compose -f docker-compose.yml -f docker-compose.secrets.yml up
services:
  allchat:
    environment:
      ALLCHAT_SECRETS_FILE: /run/secrets/allchat_secrets
    secrets:
      - allchat_secrets

secrets:
  allchat_secrets:
    file: ${ALLCHAT_SECRETS_FILE:?set ALLCHAT_SECRETS_FILE to your secrets file's absolute path}
